upstream fastapi_workers {
    server worker-1-api:8000;
    server worker-2-api:8000;
}
server {
    listen 80;
    location /videos/ {
        proxy_pass http://videos-api:8000/;
    }

    location /articles/ {
        proxy_pass http://articles-api:8000/;
    }

    location /load-balancing/ {
        proxy_pass http://fastapi_workers/;
    }

}