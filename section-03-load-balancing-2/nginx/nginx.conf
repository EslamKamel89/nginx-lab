
user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;


events {
    worker_connections 1024;
}


http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    log_format upstream_debug
    '$remote_addr "$request" '
    'status=$status '
    'upstream=$upstream_addr '
    'upstream_status=$upstream_status '
    'upstream_time=$upstream_response_time '
    'request_time=$request_time';

    access_log /var/log/nginx/access.log upstream_debug;

    sendfile on;
    #tcp_nopush     on;

    keepalive_timeout 65;

    #gzip  on;

    # include /etc/nginx/conf.d/*.conf;
    upstream backend_api {
        # the default is equal weighted round-robin algorithm
        # Least connections algorithm
        least_conn;

        # IP hash algorithm
        # ip_hash;

        # Generic hash algorithm
        # hash $request_uri consistent;
        server api-1:8000 weight=1;
        server api-2:8000 weight=1;
        server api-3:8000 weight=1;
    }
    server {
        listen 80;
        location / {
            proxy_pass http://backend_api;
            proxy_read_timeout 2s;
        }
    }
}
