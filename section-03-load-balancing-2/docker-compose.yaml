services:
  api-1:
    build:
      context: ./app
    environment:
      INSTANCE_NAME: api-1
  api-2:
    build:
      context: ./app
    environment:
      INSTANCE_NAME: api-2
  api-3:
    build:
      context: ./app
    environment:
      INSTANCE_NAME: api-3
  nginx:
    image: nginx:stable
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf"
    depends_on:
      - api-1
      - api-2
      - api-3
